name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact application source commit to check
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: pnpm test
      - name: Check release tooling from the workflow revision
        if: inputs.source_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - if: inputs.source_sha != ''
        run: node --test .release-tools/scripts/release-plan.test.mjs .release-tools/scripts/release-assets.test.mjs .release-tools/scripts/updater-manifest.test.mjs
      - run: pnpm build

  desktop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --locked -p l1-git --all-targets -- -D warnings
      - run: cargo test --locked -p l1-git
      - run: pnpm tauri build --debug
