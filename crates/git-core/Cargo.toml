[package]
name = "l1-git-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1"
same-file = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
